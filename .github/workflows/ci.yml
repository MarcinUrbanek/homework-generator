name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          PREVIEW_URL=http://127.0.0.1:4321
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "$PREVIEW_URL/"; then
              break
            fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then
              cat preview.log
              exit 1
            fi
            sleep 1
          done
          if ! curl --fail --silent --output /dev/null "$PREVIEW_URL/"; then
            cat preview.log
            echo "Astro preview did not become ready within 30 seconds" >&2
            exit 1
          fi
          source supabase.env
          BASE_URL="$PREVIEW_URL" SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SMOKE_CLASS_CHECKS=true SMOKE_CONFIGURED_PREVIEW=true npm run smoke
      - if: always()
        run: supabase stop --no-backup
